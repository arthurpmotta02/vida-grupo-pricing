# Etapa 2: taxa manual (GLMM no R, glmmTMB). Toda escolha que muda número está aqui.

meses_maturacao: 12        # experiência só até data_referencia - 12 meses (evita IBNR na estimação)
capital_referencia: 50000  # capital em que o fator de capital vale 1

# Anos com choque externo identificado, retirados da experiência da taxa manual (exposição e óbitos).
# Política, com evidência nos notebooks 02 e 04: na carteira, o A/E de 2021 (pandemia) fica fora do intervalo dos demais
# anos e, se mantido, a taxa manual superestima 2024 em ~11% (contra ~5% sem ele); no SES, a sinistralidade do
# mercado em 2021 foi de ~76% contra ~46% nos anos normais.
excluir_anos_experiencia: [2021]

faixas:                    # usadas para formar células e para os fatores candidatos
  idade:   {limites: [0, 30, 40, 50, 60, 200], rotulos: ["ate29", "30-39", "40-49", "50-59", "60+"]}
  capital: {limites: [0, 30000, 60000, 150000, 400000, .inf],
            rotulos: ["ate30k", "30-60k", "60-150k", "150-400k", "acima400k"]}
  tamanho: {limites: [0, 100, 500, 2000, .inf], rotulos: ["ate99", "100-499", "500-1999", "2000+"]}

modelo:
  # Decisão de negócio, tomada antes de olhar os dados: capital (contínuo, em log) e atividade
  # sempre entram. Estrutura de Ohlsson (2008): o fator de poucos níveis (seção CNAE) é FIXO; o de
  # muitos níveis (divisão dentro da seção) é ALEATÓRIO, ou seja, credibilidade para cada divisão
  # em torno da sua seção. O efeito de estipulante captura a heterogeneidade entre grupos.
  # (Com seção também aleatória, a variância entre ~10 seções é mal identificada e tende a zero.)
  fixos_obrigatorios: ["log_capital_c", "cnae_secao"]
  aleatorios: ["(1|cnae_secao:cnae_divisao)", "(1|id_estipulante)"]
  # Candidatos: entram só com evidência (razão de verossimilhança com correção de Holm para
  # testes múltiplos). Idade e sexo já estão na tábua; o teste mede o desvio adicional.
  fixos_candidatos: ["faixa_idade", "sexo", "faixa_tamanho"]
  alfa: 0.05
  # Seções com menos óbitos esperados que isso são agrupadas em "OUTRAS" (sem experiência para
  # um fator próprio).
  min_esperados_secao: 30

validacao_cruzada: {folds: 5, semente: 2026}   # partição por estipulante (penalização da ridge)

# Validação fora do tempo (CAS Monograph 5, seção 4.3): treino e teste separados no início; o teste só é usado
# no fim, para escolher entre os candidatos. O modelo escolhido é reajustado com toda a experiência maturada.
fora_do_tempo:
  treino_ate: "2023-12-31"
  teste: ["2024-01-01", "2024-12-31"]

# Regra de decisão, fixada antes de olhar o teste: o candidato de menor deviance no teste; entre os empatados
# com ele (IC de 95% da diferença de deviance, por bootstrap pareado por estipulante, contém zero), vale esta
# ordem de preferência. A ridge com priori vem primeiro porque combina a experiência própria com a evidência
# externa (estudo da SOA), com o peso dado por validação cruzada; o plano atual vem por último entre os
# modelos que usam a experiência.
decisao:
  # Só estes podem virar tarifa (cabem na tabela de fatores e na nota técnica). Elastic net com interações e
  # LightGBM entram na comparação como referência de desempenho, como no framework da SOA.
  # AGLM vem depois da ridge e do GLM: mais complexo, só é escolhido se for o único melhor (sem empate)
  ordem_preferencia: ["ridge com priori SOA", "GLM", "AGLM com priori SOA", "GLMM", "plano atual (tábua × A/E)"]
  bootstrap: 2000
