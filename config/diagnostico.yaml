# Etapa 4: diagnóstico com machine learning (LightGBM). Não entra na tarifa: aponta estrutura que a
# taxa manual não captura, que depois é testada no próprio GLMM (glmmTMB).

# Variáveis candidatas (o estipulante fica de fora: queremos fatores de tarifa, não o efeito de cada grupo)
variaveis: ["idade", "sexo", "log_capital", "cnae_secao", "cnae_divisao", "tipo_capital",
            "contributario", "log_porte", "ano_calendario"]
categoricas: ["sexo", "cnae_secao", "cnae_divisao", "tipo_capital", "contributario"]

# Regularização forte: mortalidade é evento raro e o modelo corre sobre poucos milhares de óbitos
lightgbm:
  objective: poisson
  learning_rate: 0.02
  num_leaves: 4
  min_data_in_leaf: 400
  min_sum_hessian_in_leaf: 5.0
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 10.0
  cat_smooth: 20
  min_data_per_group: 200
  verbose: -1
  seed: 2026
rodadas_max: 3000
parada_antecipada: 150
folds: 5
semente: 2026
bootstrap: 2000
