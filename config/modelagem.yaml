# Parâmetros da comparação de modelos, no formato do apêndice A do framework da SOA (2024).
# Os nomes da SOA estão entre parênteses.

semente_particao: 2026        # (nTrainSeed)
fracao_teste: 0.30            # base SOA: partição aleatória (a base não tem ano de observação)
minimo_esperados_nivel: 30    # agrupamento de níveis raros (CAS Monograph 5, seção 5.5)

elastic_net:
  alpha: 1.0                  # (fGLMNetAlpha) o texto da SOA descreve penalidade LASSO
  lambda: "lambda.min"        # SOA 4.3.3: o lambda de menor erro na validação cruzada
  folds: 5
  semente: 2026               # (nELSeed)
  interacoes_do_lightgbm: 3   # (nUseTopLightGBMInteractions)
  padronizar: true            # padrão do glmnet, como na SOA

# LightGBM (SOA 4.2). Dois blocos: a base da SOA é grande; a carteira tem poucos milhares de óbitos e pede
# regularização forte (árvores rasas, folhas grandes, aprendizado lento), já que mortalidade é evento raro.
lightgbm_soa:                 # (nGBMSeed e parâmetros do modelo)
  parametros: {objective: poisson, learning_rate: 0.1, num_leaves: 15, min_data_in_leaf: 200, verbose: -1, seed: 2026}
  rodadas_max: 1000
  parada_antecipada: 50
  folds: 5
  semente: 2026
  bootstrap: 200

lightgbm_carteira:
  parametros: {objective: poisson, learning_rate: 0.02, num_leaves: 4, min_data_in_leaf: 400,
               min_sum_hessian_in_leaf: 5.0, feature_fraction: 0.8, bagging_fraction: 0.8, bagging_freq: 1,
               lambda_l2: 10.0, cat_smooth: 20, min_data_per_group: 200, verbose: -1, seed: 2026}
  rodadas_max: 3000
  parada_antecipada: 150
  folds: 5                    # partição por estipulante
  semente: 2026
  bootstrap: 2000
